<!doctype html>
<!--
  Product mode reference: sign in (vocdoni-app /account/signin), plain HTML + assets/tokens/product.css.
  Split card: form left, dark testimonial showcase right (hidden below 768px), trust bar of customer
  logo tiles underneath. The showcase is the only place in the product that carries color: a deep,
  desaturated tone derived from the quoted organization's logo, carrying white text at ~13:1.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in - Vocdoni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="../assets/tokens/product.css" />
    <style>
      .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      .wrap { max-width: 1152px; margin: 0 auto; padding: 40px 16px; }
      .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .pw { position: relative; }
      .pw button { position: absolute; right: 6px; top: 50%; translate: 0 -50%; }
      .forgot { align-self: flex-end; font-size: 12px; margin-top: -10px; }
      .who { display: flex; align-items: center; gap: 12px; }
      .tile { width: 40px; height: 40px; border-radius: var(--radius-sm); background: #fff; display: grid; place-items: center; color: #251a42; font-weight: 600; font-size: 13px; }
      .trust { margin-top: 24px; font-size: 13px; color: var(--fg-muted); }
      .logos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .logos span { width: 52px; height: 52px; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; display: grid; place-items: center; font-size: 11px; color: var(--gray-600); }
      .watermark { position: absolute; right: -60px; bottom: -60px; width: 320px; height: 320px; border-radius: 50%; border: 48px solid rgb(255 255 255 / 0.09); }
    </style>
  </head>
  <body>
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></symbol>
    </svg>
    <div class="wrap">
      <div class="top">
        <a class="vp-link" href="#" style="display: inline-flex; gap: 6px; align-items: center"><svg class="i"><use href="#i-left" /></svg>Home</a>
        <button class="vp-btn vp-btn--subtle" aria-label="Change language"><svg class="i"><use href="#i-globe" /></svg></button>
      </div>

      <div class="vp-auth">
        <form class="vp-auth__form" novalidate>
          <div style="margin-bottom: 8px">
            <h1 class="vp-title-lg">Welcome back</h1>
            <p class="vp-muted vp-text-sm">Sign in to your account</p>
          </div>
          <div class="vp-field"><label class="vp-label" for="email">Email</label><input class="vp-input" id="email" type="email" placeholder="your@email.com" autocomplete="email" /></div>
          <div class="vp-field">
            <label class="vp-label" for="pw">Password</label>
            <div class="pw"><input class="vp-input" id="pw" type="password" placeholder="Min. 8 characters" autocomplete="current-password" /><button type="button" class="vp-btn vp-btn--ghost vp-btn--icon vp-btn--xs" aria-label="Show password"><svg class="i"><use href="#i-eye" /></svg></button></div>
          </div>
          <a class="vp-link forgot" href="#">Forgot your password?</a>
          <button class="vp-btn vp-btn--block" type="submit">Log in</button>
          <p class="vp-or">or continue with</p>
          <button class="vp-btn vp-btn--outline vp-btn--block" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.66 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.68 3.7 14.55 2.75 12 2.75 6.9 2.75 2.75 6.9 2.75 12s4.15 9.25 9.25 9.25c5.34 0 8.88-3.75 8.88-9.04 0-.6-.07-1.06-.15-1.51z" /></svg>
            Sign in with Google
          </button>
          <p class="vp-text-sm" style="text-align: center">Don't have an account? <a class="vp-link" href="#">Sign up</a></p>
        </form>

        <figure class="vp-auth__showcase" style="--showcase-bg: #302415; margin: 0">
          <span class="watermark" aria-hidden="true"></span>
          <span class="vp-overline" style="color: var(--gray-400); letter-spacing: 0.16em">Success stories</span>
          <blockquote class="vp-auth__quote" style="margin: 0">We chose Vocdoni because we believe this is the future of how any real election should work. Electronic voting is within everyone's reach and makes the process easier for citizens.</blockquote>
          <div class="vp-auth__rule"></div>
          <figcaption class="who">
            <span class="tile" aria-hidden="true">AB</span>
            <span><span style="display: block; font-weight: 500">Jordi Estiarte</span><span style="font-size: 13px; color: var(--gray-400)">Mayor · Ajuntament de Bellpuig</span></span>
          </figcaption>
        </figure>
      </div>

      <p class="trust">Assemblies, elections and consultations. Organizations of every size already trust Vocdoni:</p>
      <div class="logos" aria-hidden="true"><span>Logo</span><span>Logo</span><span>Logo</span><span>Logo</span><span>Logo</span><span>Logo</span><span>Logo</span><span>Logo</span></div>
    </div>
  </body>
</html>
