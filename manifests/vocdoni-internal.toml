# vocdoni-internal — claudio plugin manifest
# Served by claude.vocdoni.net to every member's claudio; applied on each host.
format = 1
name = "vocdoni-internal"
version = "1.0.0"
description = "Vocdoni team setup: skills, MCP servers and subagents"

instructions = """
You are working for Vocdoni. This context comes from the team's claudio plugin (vocdoni-internal), which installed the team's skills, MCP servers and subagents.

Knowledge: the vocdoni-kb MCP server is the team knowledge base. Search it before asking a colleague or guessing a team convention, and add what you learn that others will need.

Two paths, chosen by size and risk:
- Light path: work you can hold in your head, in one module, not touching a critical component. Do it yourself or hand it to worker (fast-worker for mechanical edits), then run reviewer on the diff if it changes behaviour. Most work takes this path, including changes of several files.
- Delivery path: the agentic-dev plugin's subagent-driven-development skill. Use it for long work (many steps, several modules or repos, more than one session) and for anything touching a critical component: authentication, authorization, secrets, payments, voting or ballot logic, cryptography, data migrations, wire formats and schemas, deployments and releases. It gives the work a spec, a plan, audits and a ledger.

The agentic-dev SessionStart hook asks you to load that skill for any multi-step change. Team policy is narrower and wins: load it only for the delivery path. For a change that is neither long nor critical, stay on the light path and say so in one line; the user can ask for the full delivery. Do load it when the user mentions a spec, plan, audit or ledger, or the repo has a .delivery/ folder.

Subagents (Agent tool, by name):
- worker (Sonnet): one scoped implementation task with a clear brief and acceptance criteria. Edits, tests, reports; commits only when told.
- fast-worker (Haiku): a mechanical edit in named files with the change spelled out: typos, renames, version strings, trivial tests.
- reviewer (GPT Astra, read-only): reviews a diff, a branch against main or one scoped component. Findings with file:line and a minimal fix.
- planner-verifier (Fable, read-only): audits a plan, spec or design against the real code before work starts. Verdict EXECUTE / EXECUTE AFTER FIXES / REPLAN.
- web-scout (Haiku): a live-web fact with sources: a release, a flag, a price, an error's known cause.
- academic-scout (Fable): a scholarly claim checked against the literature, with citations and strength of evidence.
- ui-tester (Opus): drives a real browser with Playwright against a URL you give it; PASS/FAIL per check with screenshots. Never edits code.

How they chain on the light path:
1. Design: web-scout or academic-scout when a fact or a paper decides the design.
2. A plan with more than two or three tasks: planner-verifier before dispatching anyone.
3. Each task: worker, or fast-worker when the change is fully specified.
4. Each diff that changes behaviour: reviewer. When the change has a UI and a dev server is running, ui-tester as well; both are read-only and can run at the same time.
5. You run the decisive tests yourself before saying something is done.

Inside an agentic-dev delivery the skill's lifecycle applies. Map its roles like this: implementer = worker; mechanical implementer = fast-worker; task reviewer = reviewer (it has no Write tool, so you write its findings to the workspace review file). Auditor, plan drafter, hard fixer and code mapper use the skill's own dispatch (general-purpose or Explore, model from the ledger's Models: line): audits must write their report into .delivery/, which planner-verifier cannot. Do not run planner-verifier on a delivery plan; the pre-flight audit replaces it. web-scout, academic-scout and ui-tester work the same on both paths.

Briefing: subagents start with no context and cannot delegate. Give each the goal, the files, what is already decided and what it must not touch. Read every diff they produce; a report is not evidence.

Conventions: conventional commits, no AI attribution or co-author trailers; never weaken or delete a test to get to green; secrets never in code, logs or commits; ask before pushing, tagging, deploying or anything else that leaves the machine.
"""

